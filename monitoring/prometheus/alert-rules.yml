groups:
  - name: outbox
    rules:
      # 미발행 이벤트의 대기 시간이 재발행 기준 시간(폴러가 INIT 이벤트를 다시 보내기 시작하는 시간) + 60초를 넘으면 자동 복구가 안 되는 상태다
      - alert: OutboxPublishDelayed
        expr: max(outbox_oldest_pending_age_seconds) > max(outbox_stale_threshold_seconds) + 60
        labels:
          severity: critical
        annotations:
          summary: "지갑 생성·가입 보너스 이벤트가 {{ $value | humanizeDuration }}째 발행되지 못하고 있습니다"
          description: "재발행 기준 시간보다 60초 넘게 브로커로 보내지 못한 이벤트가 있습니다. 브로커 상태와 앱 로그의 '[Outbox Scheduler] 브로커 연결 실패'를 확인하세요."
