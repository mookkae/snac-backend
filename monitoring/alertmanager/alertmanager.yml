route:
  receiver: slack

receivers:
  - name: slack
    slack_configs:
      # Slack 주소는 저장소에 두지 않는다. 컨테이너 시작 때 .env의 SLACK_WEBHOOK_URL로 이 파일을 만든다
      - api_url_file: /tmp/slack_webhook_url
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
